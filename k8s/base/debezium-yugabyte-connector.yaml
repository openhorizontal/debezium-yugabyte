apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: CONNECTOR_NAME
  labels:
    strimzi.io/cluster: yugabyte-cluster
spec:
  class: io.debezium.connector.yugabytedb.YugabyteDBgRPCConnector
  tasksMax: 1
  config:
    database.hostname: yb-tservers.yb-dev.svc.cluster.local
    database.port: 5433
    database.master.addresses: yb-masters.yb-dev.svc.cluster.local:7100

    snapshot.mode: never

    key.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: 'false'

    transforms: pgcompat,outbox
    transforms.pgcompat.type: io.debezium.connector.yugabytedb.transforms.PGCompatible
    transforms.outbox.type: io.debezium.transforms.outbox.EventRouter
    transforms.outbox.table.fields.additional.placement: eventType:header:type

    value.converter: io.debezium.converters.BinaryDataConverter
    value.converter.delegate.converter.type: org.apache.kafka.connect.json.JsonConverter
    value.converter.delegate.converter.type.schemas.enable: 'false'
